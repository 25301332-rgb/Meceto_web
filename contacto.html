<body>

  <header class="sticky-top">
   <nav class="navbar navbar-expand-lg navbar-maceto py-3">
  <div class="container">
 <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-verde-maceto" href="index.html">
  <i class="fa-solid fa-leaf"></i> MACETO
    </a>
   <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
   <span class="navbar-toggler-icon"></span>
  </button>
<div class="collapse navbar-collapse" id="menuNav">
 <ul class="navbar-nav ms-auto align-items-center gap-3">
   <li class="nav-item"><a class="nav-link text-verde-maceto" href="index.html">Inicio</a></li>
     <li class="nav-item"><a class="nav-link text-verde-maceto" href="nosotros.html">Nosotros</a></li>
    <li class="nav-item"><a class="nav-link text-verde-maceto" href="productos.html">Productos</a></li>
    <li class="nav-item"><a class="nav-link text-verde-maceto" href="cuidados.html">Guía de Cuidados</a></li>

          </ul>

    </nav>
  </header>

  <main class="py-5">
    <div class="container">
  <div class="row justify-content-center">
     <div class="col-lg-8">
      <div class="card-maceto p-4 p-md-5">
   <div class="text-center mb-4">
    <span class="eyebrow-text">— Escríbenos —</span>
     <h2 class="fw-bold text-verde-maceto title-underline">¿Tienes alguna pregunta?</h2>
     <p class="text-muted">Estamos listos para asesorarte en la elección de tu planta.</p>
   </div>

   
   <form id="formContacto">
      <div class="mb-3">
     <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
     <input type="text" class="form-control rounded-3" id="nombre" placeholder="Ej. Ana Gómez">
     </div>
     <div class="mb-3">
       <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
     <input type="email" class="form-control rounded-3" id="email" placeholder="nombre@ejemplo.com">
     </div>
       <div class="mb-3">
   <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
       <textarea class="form-control rounded-3" id="mensaje" rows="4" placeholder="¿En qué te podemos ayudar?"></textarea>
 </div>
   <button type="submit" class="btn btn-terracota btn-pill w-100 py-2 fw-semibold">Enviar Mensaje</button>
    </form>

        
    <div id="respuesta" class="mt-3"></div>
  
  </main>

  <footer class="py-4 text-center">
    <div class="container">
      <p class="mb-0">Tu planta ,Tu espacio , 0 drama</p>
    </div>
  </footer>
